services:
  - type: web
    name: eventpulse-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: eventpulse-db
          property: connectionString
      - key: CLIENT_URL
        sync: false

databases:
  - name: eventpulse-db
    databaseName: eventpulse_db
    user: eventpulse_user
    plan: free